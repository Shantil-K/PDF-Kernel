[package]
name = "pdf-kernel-cloud"
description = "Optional sync layer: Google sign-in, secure token storage, and PDFs + chat history in the user's Google Drive."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
form_urlencoded = "1"

# OS keychain on desktop: Windows Credential Manager, macOS Keychain,
# Secret Service (GNOME Keyring / KWallet) on Linux. Android uses app-private storage.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
