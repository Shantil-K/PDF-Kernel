[package]
name = "pdf-kernel-app"
description = "PDF Kernel app for Linux, Windows, macOS and Android. Calls the core in-process; no server."
version = "0.1.0"
edition = "2021"

# Android/iOS load the app as a library.
[lib]
name = "pdf_kernel_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdf-kernel = { path = "../../../crates/core" }
pdf-kernel-cloud = { path = "../../../crates/cloud" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
