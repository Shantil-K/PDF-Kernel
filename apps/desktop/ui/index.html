<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Kernel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>PDF Kernel</h1>
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
      <strong>Open PDF</strong>
      <span>or drop files here</span>
    </label>
    <ul id="docs" class="docs"></ul>
    <div class="provider">
      <label for="provider">Provider</label>
      <select id="provider"><option value="">Auto (fallback order)</option></select>
      <p id="keys" class="muted"></p>
    </div>
  </aside>

  <main>
    <div id="empty" class="empty">
      <p>Open a PDF to summarize it or ask questions.</p>
    </div>

    <section id="workspace" hidden>
      <header class="doc-header">
        <div>
          <h2 id="doc-name"></h2>
          <p id="doc-meta" class="muted"></p>
        </div>
        <div class="styles" role="group" aria-label="Summary style">
          <button data-style="brief">Brief</button>
          <button data-style="detailed">Detailed</button>
          <button data-style="bullets">Bullets</button>
        </div>
      </header>

      <div id="thread" class="thread" aria-live="polite"></div>

      <form id="ask" class="ask">
        <input id="question" placeholder="Ask about this document…" autocomplete="off">
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
