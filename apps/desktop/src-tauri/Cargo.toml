[package]
name = "pdf-kernel-desktop"
description = "Reference desktop app for pdf-kernel. Calls the core in-process; no server."
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pdf-kernel = { path = "../../../crates/core" }
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
