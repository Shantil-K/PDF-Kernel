name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Baked into the app at build time. Add them under
  # Settings → Secrets and variables → Actions. Without them the app still
  # builds, but only "This device" storage is available.
  PDFK_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  PDFK_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc, so the AppImage runs on more distros
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: apps/app
        run: |
          npm ci
          npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-kernel-${{ matrix.name }}
          path: |
            apps/app/src-tauri/target/release/bundle/deb/*.deb
            apps/app/src-tauri/target/release/bundle/rpm/*.rpm
            apps/app/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/app/src-tauri/target/release/bundle/msi/*.msi
            apps/app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default also installs the retired "tools" package, which fails.
          packages: platform-tools
      - name: Android SDK packages
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Android project
        working-directory: apps/app
        run: |
          npm ci
          npm run tauri -- android init --ci
          # Replace the template launcher icons with ours.
          npm run tauri -- icon src-tauri/icons/icon.png
      - name: Build APK
        working-directory: apps/app
        # Gradle calls back into `npm run tauri`, so it must run from here.
        run: npm run tauri -- android build --apk --ci --target aarch64 --target armv7 --target x86_64
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(find apps/app/src-tauri/gen/android -name '*-unsigned.apk' | head -n1)
          test -n "$APK"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            # No release key configured: sign with a throwaway key so the APK
            # installs for testing. Updates need an uninstall first.
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; using a temporary signing key"
            KEYSTORE_PASSWORD=temporary KEY_ALIAS=temp
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=PDF Kernel test"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" \
            --out pdf-kernel-android.apk aligned.apk
          "$BT/apksigner" verify pdf-kernel-android.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-kernel-android
          path: pdf-kernel-android.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
